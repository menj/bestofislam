name: Package theme

# Builds bestofislam-<version>.zip, the file uploaded under Appearance,
# Themes, after the image scripts have run, and refuses to package a theme
# that holds anything but AVIF article images.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install 'pillow>=11.3'

      - name: Check images
        run: python bin/convert-images.py

      - name: Build the zip
        run: |
          version=$(sed -n 's/^Version: *//p' style.css | head -1)
          mkdir -p dist/bestofislam
          rsync -a --exclude='.git' --exclude='.github' --exclude='.githooks' --exclude='bin' --exclude='dist' ./ dist/bestofislam/
          (cd dist && zip -qr "bestofislam-${version}.zip" bestofislam)
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: bestofislam-theme
          path: dist/*.zip
