<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bad gateway | Best of Islam</title>
<style>
:root{--bg:#F4F8FC;--ink:#0D2B4F;--muted:#4F6580;--gold:#E8B33C;--azure:#1F6FCC;--card:#FFFFFF;--edge:rgba(13,43,79,.12)}
@media (prefers-color-scheme:dark){:root{--bg:#06182C;--ink:#EAF2FB;--muted:#9DB3C9;--gold:#E8B33C;--azure:#42A5F8;--card:#0D2B4F;--edge:rgba(234,242,251,.14)}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);color:var(--ink);font-family:Vollkorn,Georgia,"Times New Roman",serif;line-height:1.55}
main{width:min(540px,100%);padding:44px 40px 40px;background:var(--card);border:1px solid var(--edge);border-top:4px solid var(--gold);border-radius:16px;text-align:center}
.mark{width:64px;height:64px}
.name{margin:14px 0 0;font-size:1.35rem;font-weight:800;letter-spacing:-.03em;text-transform:lowercase}
h1{margin:26px 0 12px;font-size:clamp(1.6rem,4vw,2.1rem);font-weight:700;line-height:1.2}
p{margin:0 auto 10px;max-width:42ch;font-size:1.08rem;color:var(--muted)}
.again{margin-top:26px;display:inline-block;padding:11px 26px;border-radius:999px;background:var(--azure);color:#fff;font-weight:700;text-decoration:none}
.again:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

</style>
</head>
<body>
<main role="main">
<svg class="mark" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><rect x="4" y="4" width="112" height="112" rx="22" fill="none" stroke="currentColor" stroke-opacity=".28" stroke-width="5"/><g stroke-linecap="round" stroke-width="10"><line x1="30" y1="38" x2="92" y2="38" stroke="#E8B33C"/><line x1="30" y1="60" x2="78" y2="60" stroke="#42A5F8"/><line x1="30" y1="82" x2="60" y2="82" stroke="currentColor"/></g></svg>
<p class="name">Best of Islam</p>
<h1>Bad gateway</h1>
<p>A server between you and the site gave a wrong answer.</p>
<p>Please try again shortly.</p>
<a class="again" href="/">Try again</a>
</main>
</body>
</html>
